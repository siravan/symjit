[workspace]
members = ["macros"]

[package]
name = "symjit"
version = "3.0.0"
edition = "2024"
authors = ["Shahriar Iravanian <siravan@svtsim.com>"]
license = "MIT"
description = "a lightweight just-in-time (JIT) optimizer compiler"
readme = "README.md"
repository = "https://github.com/siravan/symjit"
keywords = ["compiler", "just-in-time compilation", "computer algebra system"]
categories = ["compilers", "hardware-support", "mathematics"]

[dependencies]
# the intermediate representation and code generators (../core, shared with sjc)
symjit-core = { path = "../core", version = "3.0.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memmap2 = { version = "0.9", optional = true }
anyhow = "1"
libc = "0.2"
# libm = "0.2"
region = "3.0.2"
wasmtime-jit-icache-coherence = "*"
num-traits = "0.2"
rayon = "1.1"
spec_math = "0.1.6"
# petgraph= "0.8.3"
hashbrown = "0.16.0"
# num-traits = "0.2"
num-complex = "0.4"
num-rational = "0.4"
wide = "1.1"
toml= "1.1"
hugepage-rs = "0.1"
lazy_static = "1.5"
rand = "0.10"
corosensei = "0.3.4"
# the #[kernel] attribute macro (feature `composer`)
symjit-macros = { path = "macros", version = "3.0.0", optional = true }

[dev-dependencies]
# compile-fail tests of the #[kernel] macro (tests/kernel_ui.rs, feature `composer`)
trybuild = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Memory"] }

[features]
selinux-fix = ["memmap2"]
default = ["async", "sympy"]
symbolica = []
libm = ["symjit-core/libm"]
async = ["symjit-core/async"]
# the kernel builder's `compile` (rust/kernel.rs; the builder itself is symjit-core's) and the
# #[kernel] macro (macros/)
composer = ["dep:symjit-macros", "symjit-core/composer"]
# symjit's own math library (rust/libm.rs): generic functions inlined in the kernels with
# `inline_math` (vectorized in the SIMD kernels), also usable on f64 and with the kernel builder
math = ["symjit-core/math"]
# the C interface used by the Python package (rust/sympy.rs: compile, run, evaluate, ...);
# without it, the library has only the Rust API
sympy = []

[lib]
path = "rust/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "profiler"
path = "profile/profiler.rs"

[[example]]
name = "rk4_bessel"
path = "examples/claude/rk4_bessel.rs"
required-features = ["composer"]

[[example]]
name = "pi_hypersphere"
path = "examples/claude/pi_hypersphere.rs"
required-features = ["composer"]
