[workspace]
members = ["macros"]

[package]
name = "symjit"
version = "2.28.0"
edition = "2021"
authors = ["Shahriar Iravanian <siravan@svtsim.com>"]
license = "MIT"
description = "a lightweight just-in-time (JIT) optimizer compiler"
readme = "README.md"
repository = "https://github.com/siravan/symjit"
keywords = ["compiler", "just-in-time compilation", "computer algebra system"]
categories = ["compilers", "hardware-support", "mathematics"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memmap2 = { version = "0.9", optional = true }
anyhow = "1"
libc = "0.2"
# libm = "0.2"
region = "3.0.2"
wasmtime-jit-icache-coherence = "*"
num-traits = "0.2"
rayon = "1.1"
spec_math = "0.1.6"
# petgraph= "0.8.3"
hashbrown = "0.16.0"
# num-traits = "0.2"
num-complex = "0.4"
num-rational = "0.4"
wide = "1.1"
toml= "1.1"
hugepage-rs = "0.1"
lazy_static = "1.5"
rand = "0.10"
corosensei = { version = "0.3.4", optional = true }
# the #[kernel] attribute macro (feature `composer`)
symjit-macros = { path = "macros", version = "2.28.0", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Memory"] }

[features]
selinux-fix = ["memmap2"]
default = ["async", "composer"]
symbolica = []
libm = []
async = ["dep:corosensei"]
# a typed builder for Composer kernels (rust/kernel.rs) and the #[kernel] macro (macros/)
composer = ["dep:symjit-macros"]
# the WebAssembly backend (`ty = "wasm"`, rust/wasm); without it, `ty = "wasm"` is an error
wasm = []
# relocatable object files (ELF, Mach-O) for linking kernels into C/C++ programs (rust/linker)
obj = []

[profile.profiling]
  inherits = "release"
  debug = true

[lib]
path = "rust/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "profiler"
path = "profile/profiler.rs"
