<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mandelbrot (symjit to WebAssembly)</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; margin: 16px; background: #f4f4f6; color: #222; }
  @media (prefers-color-scheme: dark) { body { background: #16161a; color: #ddd; } }
  canvas { display: block; max-width: 100%; height: auto; border-radius: 6px; background: #000; }
  p { max-width: 600px; }
  code { font-size: 0.95em; }
</style>
</head>
<body>
<h1>Mandelbrot set</h1>
<canvas id="canvas" width="600" height="600"></canvas>
<p id="status">Loading out/mandelbrot.wasm…</p>
<p>
  Each pixel is computed by <code>out/mandelbrot.wasm</code>, generated by
  <code>mandelbrot.py</code> from a symjit <code>Composer</code> program: 19 iterations of
  z &larr; z&sup2; + c, then &radic;|z| if |z| &lt; 4, else 0 (the point escaped, drawn dark).
</p>
<script type="module">
// The region of the complex plane shown (as in examples/composer/manderbrot.py)
const RE = [-2, 1], IM = [-1.5, 1.5];

const canvas = document.getElementById("canvas");
const status = document.getElementById("status");

// A colour for the module's output v = sqrt(|z|) in [0, 2): 0 = escaped.
function colour(v) {
    if (!(v > 0)) return [12, 14, 40];
    const t = Math.min(v / 1.5, 1);
    return [
        Math.round(255 * Math.min(1, 0.2 + 1.6 * t)),
        Math.round(255 * Math.min(1, 1.4 * t * t)),
        Math.round(255 * (0.35 + 0.4 * Math.sin(3 * t))),
    ];
}

// BEGIN render
// Evaluates the module at every pixel. Complex models take their inputs as (re, im)
// pairs of f64 and write their outputs the same way: run(outs, 0, 0, inputs),
// with both buffers in the module's memory above __heap_base.
function render(exports, width, height, re, im) {
    const { run, memory, __heap_base } = exports;
    const outs = __heap_base.value;   // 1 complex output = 2 f64
    const inputs = outs + 16;         // 1 complex input = 2 f64
    const f64 = new Float64Array(memory.buffer);
    const pixels = new Uint8ClampedArray(4 * width * height);

    for (let row = 0; row < height; row++) {
        const y = im[1] - (row + 0.5) * (im[1] - im[0]) / height;
        for (let col = 0; col < width; col++) {
            f64[inputs / 8] = re[0] + (col + 0.5) * (re[1] - re[0]) / width;
            f64[inputs / 8 + 1] = y;
            if (run(outs, 0, 0, inputs) !== 0) throw new Error("the module's stack is exhausted");
            const [r, g, b] = colour(f64[outs / 8]); // the real part
            const k = 4 * (row * width + col);
            pixels[k] = r; pixels[k + 1] = g; pixels[k + 2] = b; pixels[k + 3] = 255;
        }
    }
    return pixels;
}
// END render

try {
    const response = await fetch("out/mandelbrot.wasm");
    if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
    // the module imports nothing (the program uses only arithmetic)
    const { instance } = await WebAssembly.instantiate(await response.arrayBuffer(), { symjit: {} });

    const t0 = performance.now();
    const pixels = render(instance.exports, canvas.width, canvas.height, RE, IM);
    const ms = performance.now() - t0;

    canvas.getContext("2d").putImageData(new ImageData(pixels, canvas.width, canvas.height), 0, 0);
    status.textContent = `${canvas.width} × ${canvas.height} points in ${ms.toFixed(0)} ms.`;
} catch (e) {
    status.textContent = `Could not run out/mandelbrot.wasm (${e.message}). Run mandelbrot.py, then serve ` +
        "this directory (python -m http.server 8000) and open http://localhost:8000/mandelbrot.html; " +
        "browsers do not load modules from file:// URLs.";
}
</script>
</body>
</html>
