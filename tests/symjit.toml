# Configuration for the integration tests (common::base_config points SYMJIT_TOML here), so a
# symjit.toml in the working directory cannot change them. The values are the built-in
# defaults of Config::default(), written by Config::to_toml; list every key, since a missing
# one is read as 0/false (e.g. stack_limit = 0).
ty = "native"

[options]
use_simd = true
enable_simd512 = false
use_threads = false
cse = true
fastmath = true
complex = false
symbolica = true
simd_branch = false
compact = true
compress = false
direct = false
fast_complex = true
huge = false
parallel_mul = true
direct_arena = false
direct_arena_identity_output = true
opt_level = 2
stack_limit = 1048576
num_args = 64
coroutines = false

[debug]
bytecode = false
scalar = false
simd = false
stats = false
topology = false
lock = false
instructions = false
